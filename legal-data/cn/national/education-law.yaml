# 中国教育法律相关条款
# ============================================================
law_name: 中华人民共和国未成年人保护法
law_name_en: Law on the Protection of Minors
category: education
country_code: CN
effective_date: 2021-06-01
last_amended: 2020-10-17
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第39条"
    ref_en: "Article 39"
    title: 校园欺凌防控制度
    full_text: |
      学校应当建立学生欺凌防控工作制度，对教职员工、学生等开展防治学生欺凌的教育和培训。
      学校对学生欺凌行为应当立即制止，通知实施欺凌和被欺凌未成年学生的父母或者其他监护人
      参与欺凌行为的认定和处理；对相关未成年学生及时给予心理辅导、教育和引导；
      对相关未成年学生的父母或者其他监护人给予必要的家庭教育指导。
      对实施欺凌的未成年学生，学校应当根据欺凌行为的性质和程度，依法加强管教。
      对严重的欺凌行为，学校不得隐瞒，应当及时向公安机关、教育行政部门报告，
      并配合相关部门依法处理。
    summary: |
      校园欺凌不是"同学间的小打小闹"——学校有法定义务：
      • 必须建立防欺凌制度
      • 发现欺凌要立即制止
      • 通知双方家长参与处理
      • 严重欺凌必须报告公安机关
      如果你或你认识的人遭遇校园欺凌，记住：学校不处理就是违法！
      被欺凌者有权要求学校履行法定保护义务。
    keywords: [校园欺凌, 学校, 未成年人保护, 报告, 心理辅导]
    tags: [校园安全, 未成年人保护]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第75条"
    ref_en: "Article 75"
    title: 网络游戏服务提供者义务
    full_text: |
      网络游戏经依法审批后方可运营。
      国家建立统一的未成年人网络游戏电子身份认证系统。网络游戏服务提供者应当要求
      未成年人以真实身份信息注册并登录网络游戏。
      网络游戏服务提供者应当按照国家有关规定和标准，对游戏产品进行分类，做出适龄提示，
      并采取技术措施，不得让未成年人接触不适宜的游戏或者游戏功能。
      网络游戏服务提供者不得在每日二十二时至次日八时向未成年人提供网络游戏服务。
    summary: |
      网络游戏的未成年人保护规定：
      • 游戏必须经过审批才能运营
      • 未成年人必须实名注册
      • 游戏要做适龄提示
      • ★ 晚上10点到早上8点，不能向未成年人提供游戏服务
      这就是"防沉迷系统"的法律基础！如果平台不执行，是在违法。
    keywords: [网络游戏, 未成年人, 防沉迷, 实名认证, 游戏时间]
    tags: [网络安全, 未成年人保护, 游戏]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第130条"
    ref_en: "Article 130"
    title: 未成年人网络欺凌
    full_text: |
      任何组织或者个人不得通过网络以文字、图片、音视频等形式，
      对未成年人实施侮辱、诽谤、威胁或者恶意损害形象等网络欺凌行为。
      遭受网络欺凌的未成年人及其父母或者其他监护人有权通知网络服务提供者
      采取删除、屏蔽、断开链接等措施。网络服务提供者接到通知后，
      应当及时采取必要的措施制止网络欺凌行为，防止信息扩散。
    summary: |
      网络欺凌也是欺凌——法律明确禁止：
      • 不能通过网络对未成年人进行侮辱、诽谤、威胁
      • 被欺凌者可以通知平台删除
      • 平台必须及时处理
      这在日常生活中非常实用：如果你或同学在网上被骂、被造谣、被恶意 P 图，
      你可以要求平台删除相关内容，这是法律赋予你的权利。
    keywords: [网络欺凌, 未成年人, 网络暴力, 删除, 平台责任]
    tags: [网络安全, 校园, 未成年人保护]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第16条"
    ref_en: "Article 16"
    title: 监护人职责
    full_text: |
      未成年人的父母或者其他监护人应当履行下列监护职责：
      （一）为未成年人提供生活、健康、安全等方面的保障；
      （二）关注未成年人的生理、心理状况和情感需求；
      （三）教育和引导未成年人遵纪守法、勤俭节约，养成良好的思想品德和行为习惯；
      （四）对未成年人进行安全教育，提高未成年人的自我保护意识和能力；
      （五）尊重未成年人受教育的权利，保障适龄未成年人依法接受并完成义务教育；
      （六）保障未成年人休息、娱乐和体育锻炼的时间；
      （七）妥善管理和保护未成年人的财产；
      （八）依法代理未成年人实施民事法律行为；
      （九）预防和制止未成年人的不良行为和违法犯罪行为，并进行合理管教；
      （十）其他应当履行的监护职责。
    summary: |
      父母/监护人的法定责任清单（节选要点）：
      • 保障生活、健康、安全
      • 关注心理和情感需求，不只是"给钱"
      • 尊重受教育权，保障完成义务教育
      • 保障休息、娱乐、体育锻炼时间（不能无限压榨学习）
      • 预防和制止不良行为、违法犯罪
      监护不只是"养"，更是"育"——这些都是法律义务，不是可做可不做。
    keywords: [监护, 父母, 监护人, 抚养, 未成年人保护, 义务教育]
    tags: [未成年人保护, 家庭监护]
    life_stage_tags: [childhood, teen, young_adult]
    difficulty: 1

  - ref: "第17条"
    ref_en: "Article 17"
    title: 禁止家庭暴力与侵害
    full_text: |
      未成年人的父母或者其他监护人不得实施下列行为：
      （一）虐待、遗弃、非法送养未成年人或者对未成年人实施家庭暴力；
      （二）放任、教唆或者利用未成年人实施违法犯罪行为；
      （三）放任、唆使未成年人参与邪教、迷信活动或者接受恐怖主义、分裂主义、极端主义等侵害；
      （四）放任、唆使未成年人吸烟（含电子烟）、饮酒、赌博、流浪乞讨或者欺凌他人；
      （五）放任或者迫使应当接受义务教育的未成年人失学、辍学；
      （六）放任未成年人沉迷网络，接触危害其身心健康的图书、影视、网络信息等；
      （七）放任未成年人进入营业性娱乐场所、酒吧、互联网上网服务营业场所等不适宜场所；
      （八）允许或者迫使未成年人从事国家规定以外的劳动；
      （九）允许、迫使未成年人结婚或者为未成年人订立婚约；
      （十）违法处分、侵吞未成年人的财产或者利用未成年人牟取不正当利益。
    summary: |
      这些是法律明令禁止的行为（节选要点）：
      • 家庭暴力、虐待、遗弃 → 禁止
      • 放任孩子吸烟、饮酒、赌博 → 禁止
      • 迫使孩子失学辍学 → 禁止
      • 放任孩子沉迷网络、进入网吧酒吧 → 禁止
      • 允许未成年结婚、订立婚约 → 禁止
      现实意义：家暴不是"家务事"，是违法甚至犯罪。任何人发现都可以举报。
    keywords: [家庭暴力, 虐待, 监护, 未成年人, 禁止行为, 辍学]
    tags: [未成年人保护, 家庭暴力, 监护]
    life_stage_tags: [childhood, teen, young_adult]
    difficulty: 2

  - ref: "第76条"
    ref_en: "Article 76"
    title: 未成年人网络直播限制
    full_text: |
      网络直播服务提供者不得为未满十六周岁的未成年人提供网络直播发布者账号注册服务；
      为年满十六周岁的未成年人提供网络直播发布者账号注册服务时，
      应当对其身份信息进行认证，并征得其父母或者其他监护人同意。
    summary: |
      未成年人直播有严格限制：
      • 不满16周岁 → 平台不能提供直播账号（不能开播）
      • 满16周岁 → 可以开播，但必须身份认证 + 父母/监护人同意
      现实意义：看到"小孩直播"、"萌娃带货"要警惕，很多是违规甚至涉及利用儿童牟利。
      家长不要让孩子过早接触直播，更要防止孩子被诱导做直播。
    keywords: [网络直播, 未成年人, 直播, 打赏, 儿童, 平台]
    tags: [网络安全, 未成年人保护, 直播]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第27条"
    ref_en: "Article 27"
    title: 禁止体罚与侮辱人格
    full_text: |
      学校、幼儿园的教职员工应当尊重未成年人人格尊严，
      不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。
    summary: |
      老师和教职员工也不能体罚：
      • 不能体罚、变相体罚（罚站罚跑超出限度、打骂等）
      • 不能侮辱人格尊严（羞辱、公开批评羞辱等）
      • 尊重学生的人格尊严是法定义务
      现实提醒：如果遇到老师过度体罚或侮辱，学生和家长有权向学校、教育部门投诉举报。
    keywords: [体罚, 教师, 学校, 人格尊严, 变相体罚, 学生]
    tags: [校园安全, 未成年人保护, 教师]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第25条"
    ref_en: "Article 25"
    title: 学校保护职责
    full_text: |
      学校应当全面贯彻国家教育方针，坚持立德树人，实施素质教育，提高教育质量，
      注重培养未成年学生认知能力、合作能力、创新能力和实践能力，促进未成年学生全面发展。
      学校应当建立未成年学生保护工作制度，健全学生行为规范，
      培养未成年学生遵纪守法的良好行为习惯。
    summary: |
      学校的责任不只是教书：
      • 要立德树人、素质教育，促进全面发展
      • 必须建立学生保护工作制度
      • 培养遵纪守法的行为习惯
      现实意义：学校有保护未成年学生的法定职责，包括预防欺凌、性侵、安全事故等。
      如果学校未履行保护义务，需要承担相应责任。
    keywords: [学校保护, 素质教育, 学生, 立德树人, 学校职责]
    tags: [校园安全, 未成年人保护, 学校]
    life_stage_tags: [childhood, teen]
    difficulty: 1
