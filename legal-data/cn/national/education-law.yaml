law_name: 中华人民共和国未成年人保护法
law_name_en: Law on the Protection of Minors
category: education
country_code: CN
effective_date: 2021-06-01
last_amended: 2020-10-17
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第39条"
    ref_en: "Article 39"
    title: 校园欺凌防控制度
    full_text: |
      学校应当建立学生欺凌防控工作制度，对教职员工、学生等开展防治学生欺凌的教育和培训。
      学校对学生欺凌行为应当立即制止，通知实施欺凌和被欺凌未成年学生的父母或者其他监护人
      参与欺凌行为的认定和处理；对相关未成年学生及时给予心理辅导、教育和引导；
      对相关未成年学生的父母或者其他监护人给予必要的家庭教育指导。
      对实施欺凌的未成年学生，学校应当根据欺凌行为的性质和程度，依法加强管教。
      对严重的欺凌行为，学校不得隐瞒，应当及时向公安机关、教育行政部门报告，
      并配合相关部门依法处理。
    summary: |
      校园欺凌不是"同学间的小打小闹"——学校有法定义务：
      • 必须建立防欺凌制度
      • 发现欺凌要立即制止
      • 通知双方家长参与处理
      • 严重欺凌必须报告公安机关
      如果你或你认识的人遭遇校园欺凌，记住：学校不处理就是违法！
      被欺凌者有权要求学校履行法定保护义务。
    keywords: [校园欺凌, 学校, 未成年人保护, 报告, 心理辅导]
    tags: [校园安全, 未成年人保护]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第75条"
    ref_en: "Article 75"
    title: 网络游戏服务提供者义务
    full_text: |
      网络游戏经依法审批后方可运营。
      国家建立统一的未成年人网络游戏电子身份认证系统。网络游戏服务提供者应当要求
      未成年人以真实身份信息注册并登录网络游戏。
      网络游戏服务提供者应当按照国家有关规定和标准，对游戏产品进行分类，做出适龄提示，
      并采取技术措施，不得让未成年人接触不适宜的游戏或者游戏功能。
      网络游戏服务提供者不得在每日二十二时至次日八时向未成年人提供网络游戏服务。
    summary: |
      网络游戏的未成年人保护规定：
      • 游戏必须经过审批才能运营
      • 未成年人必须实名注册
      • 游戏要做适龄提示
      • ★ 晚上10点到早上8点，不能向未成年人提供游戏服务
      这就是"防沉迷系统"的法律基础！如果平台不执行，是在违法。
    keywords: [网络游戏, 未成年人, 防沉迷, 实名认证, 游戏时间]
    tags: [网络安全, 未成年人保护, 游戏]
    life_stage_tags: [childhood, teen]
    difficulty: 1

  - ref: "第130条"
    ref_en: "Article 130"
    title: 未成年人网络欺凌
    full_text: |
      任何组织或者个人不得通过网络以文字、图片、音视频等形式，
      对未成年人实施侮辱、诽谤、威胁或者恶意损害形象等网络欺凌行为。
      遭受网络欺凌的未成年人及其父母或者其他监护人有权通知网络服务提供者
      采取删除、屏蔽、断开链接等措施。网络服务提供者接到通知后，
      应当及时采取必要的措施制止网络欺凌行为，防止信息扩散。
    summary: |
      网络欺凌也是欺凌——法律明确禁止：
      • 不能通过网络对未成年人进行侮辱、诽谤、威胁
      • 被欺凌者可以通知平台删除
      • 平台必须及时处理
      这在日常生活中非常实用：如果你或同学在网上被骂、被造谣、被恶意 P 图，
      你可以要求平台删除相关内容，这是法律赋予你的权利。
    keywords: [网络欺凌, 未成年人, 网络暴力, 删除, 平台责任]
    tags: [网络安全, 校园, 未成年人保护]
    life_stage_tags: [childhood, teen]
    difficulty: 1
