# ============================================================
# 中国道路交通安全法律法规
# ============================================================
law_name: 中华人民共和国道路交通安全法
law_name_en: Road Traffic Safety Law of the PRC
category: traffic
country_code: CN
effective_date: 2004-05-01
last_amended: 2021-04-29
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第91条"
    ref_en: "Article 91"
    title: 酒后驾车处罚
    full_text: |
      饮酒后驾驶机动车的，处暂扣六个月机动车驾驶证，并处一千元以上二千元以下罚款。
      因饮酒后驾驶机动车被处罚，再次饮酒后驾驶机动车的，处十日以下拘留，
      并处一千元以上二千元以下罚款，吊销机动车驾驶证。
      醉酒驾驶机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，
      依法追究刑事责任；五年内不得重新取得机动车驾驶证。
      饮酒后驾驶营运机动车的，处十五日拘留，并处五千元罚款，吊销机动车驾驶证，
      五年内不得重新取得机动车驾驶证。
      醉酒驾驶营运机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，
      依法追究刑事责任；十年内不得重新取得机动车驾驶证，重新取得机动车驾驶证后，
      不得驾驶营运机动车。
      饮酒后或者醉酒驾驶机动车发生重大交通事故，构成犯罪的，依法追究刑事责任，
      并由公安机关交通管理部门吊销机动车驾驶证，终生不得重新取得机动车驾驶证。
    summary: |
      酒后开车后果非常严重：
      • 饮酒驾车（20-80mg/100ml）：暂扣驾照6个月 + 罚款1000-2000元
      • 再次饮酒驾车：拘留≤10天 + 罚款1000-2000元 + 吊销驾照
      • 醉酒驾车（≥80mg/100ml）：吊销驾照 + 追究刑事责任 + 5年内不能重考
      • 醉酒驾驶营运车辆：吊销驾照 + 判刑 + 10年内不能重考
      • 酒驾/醉驾发生重大事故：终生禁驾 + 判刑
      记住：开车不喝酒，喝酒不开车！代驾几十块钱，驾照没了可不止这点钱。
    keywords: [酒驾, 醉驾, 吊销驾照, 罚款, 刑事责任, 酒后驾车]
    tags: [交通安全, 刑事责任, 罚款]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第76条"
    ref_en: "Article 76"
    title: 机动车交通事故责任
    full_text: |
      机动车发生交通事故造成人身伤亡、财产损失的，由保险公司在机动车第三者责任
      强制保险责任限额范围内予以赔偿；不足的部分，按照下列规定承担赔偿责任：
      （一）机动车之间发生交通事故的，由有过错的一方承担赔偿责任；双方都有过错的，
      按照各自过错的比例分担责任。
      （二）机动车与非机动车驾驶人、行人之间发生交通事故，非机动车驾驶人、行人
      没有过错的，由机动车一方承担赔偿责任；有证据证明非机动车驾驶人、行人有过错的，
      根据过错程度适当减轻机动车一方的赔偿责任；机动车一方没有过错的，
      承担不超过百分之十的赔偿责任。
      交通事故的损失是由非机动车驾驶人、行人故意碰撞机动车造成的，机动车一方不承担赔偿责任。
    summary: |
      发生交通事故后怎么赔：
      • 首先由交强险（强制保险）赔付
      • 不够的话：
        - 车撞车 → 谁有错谁赔，都有错按比例分担
        - 车撞人 → 机动车承担更多责任
          • 行人没错 → 机动车全赔
          • 行人也有错 → 适当减轻机动车的责任
          • 机动车没错 → 仍要赔不超过10%（人道主义）
        - 行人故意碰瓷 → 机动车不赔
      这个条款体现了"保护弱者"的原则——行人和非机动车在路上是相对弱势的一方。
    keywords: [交通事故, 责任认定, 赔偿, 交强险, 行人, 机动车]
    tags: [交通安全, 事故赔偿]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第99条"
    ref_en: "Article 99"
    title: 无证驾驶与肇事逃逸
    full_text: |
      有下列行为之一的，由公安机关交通管理部门处二百元以上二千元以下罚款：
      （一）未取得机动车驾驶证、机动车驾驶证被吊销或者机动车驾驶证被暂扣期间驾驶机动车的；
      （二）将机动车交由未取得机动车驾驶证或者机动车驾驶证被吊销、暂扣的人驾驶的；
      （三）造成交通事故后逃逸，尚不构成犯罪的；...
      有第一项、第三项、第五项至第八项情形之一的，可以并处十五日以下拘留。
    summary: |
      这些行为都要重罚：
      • 无证驾驶（没驾照/驾照被吊销/暂扣期间开车） → 200-2000元罚款 + 可拘留≤15天
      • 把车借给没驾照的人开 → 同样罚款
      • 事故逃逸但不构成犯罪 → 200-2000元罚款 + 可拘留≤15天
      特别是肇事逃逸，即使事故不严重，逃逸本身就可能让你进拘留所。
      出了事故一定要停车、保护现场、救人、报警！逃逸只会让后果严重十倍。
    keywords: [无证驾驶, 逃逸, 罚款, 拘留, 交通事故]
    tags: [交通安全, 违法行为]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第47条"
    ref_en: "Article 47"
    title: 斑马线礼让行人
    full_text: |
      机动车行经人行横道时，应当减速行驶；遇行人正在通过人行横道，应当停车让行。
      机动车行经没有交通信号的道路时，遇行人横过道路，应当避让。
    summary: |
      斑马线前必须让行：
      • 行经人行横道 → 减速
      • 行人正在通过 → 停车让行
      • 没有信号灯的路段遇行人横过 → 避让
      不礼让行人会被罚款扣分；如果因此撞伤行人，机动车基本要承担主要或全部责任。
      记住：斑马线是行人的"安全线"，也是驾驶人的"法律红线"。
    keywords: [斑马线, 礼让行人, 人行横道, 避让, 扣分]
    tags: [交通安全, 礼让, 行人]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第51条"
    ref_en: "Article 51"
    title: 安全带与头盔
    full_text: |
      机动车行驶时，驾驶人、乘坐人员应当按规定使用安全带，
      摩托车驾驶人及乘坐人员应当按规定戴安全头盔。
    summary: |
      安全带和头盔不是"建议"而是"应当"：
      • 驾驶人、乘坐人员（包括后排）都要系安全带
      • 摩托车驾乘人员都要戴头盔
      • 不系安全带、不戴头盔是违法行为，会罚款
      现实提醒：后排不系安全带同样危险，发生事故时后排伤亡率很高。
      一盔一带，安全常在。
    keywords: [安全带, 头盔, 摩托车, 安全, 后排]
    tags: [交通安全, 安全带, 头盔]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第42条"
    ref_en: "Article 42"
    title: 限速规定
    full_text: |
      机动车上道路行驶，不得超过限速标志标明的最高时速。
      在没有限速标志的路段，应当保持安全车速。
      夜间行驶或者在容易发生危险的路段行驶，以及遇有沙尘、冰雹、雨、雪、雾、
      结冰等气象条件时，应当降低行驶速度。
    summary: |
      速度与安全：
      • 不能超过限速标志的最高时速
      • 没有限速标志 → 保持安全车速
      • 夜间、危险路段、恶劣天气 → 必须降速
      超速不仅罚款扣分，更是事故的头号诱因。十次事故九次快，
      尤其雨雪雾天，降速慢行才是对自己和他人负责。
    keywords: [限速, 超速, 安全车速, 恶劣天气, 减速]
    tags: [交通安全, 限速, 超速]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第19条"
    ref_en: "Article 19"
    title: 机动车驾驶证
    full_text: |
      驾驶机动车，应当依法取得机动车驾驶证。
      申请机动车驾驶证，应当符合国务院公安部门规定的驾驶许可条件；
      经考试合格后，由公安机关交通管理部门发给相应类别的机动车驾驶证。
    summary: |
      开车必须有驾照：
      • 驾驶机动车 → 必须依法取得驾驶证
      • 需要符合条件 + 考试合格才能发证
      • 无证驾驶是严重违法（第99条有处罚）
      提醒：驾照有准驾车型限制，C1不能开摩托车，A/B证不能开小车超范围。
      驾驶与准驾车型不符也按无证驾驶处理。
    keywords: [驾驶证, 驾照, 无证驾驶, 准驾车型, 考试]
    tags: [交通安全, 驾驶证, 准驾]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第70条"
    ref_en: "Article 70"
    title: 交通事故现场处理
    full_text: |
      在道路上发生交通事故，车辆驾驶人应当立即停车，保护现场；
      造成人身伤亡的，车辆驾驶人应当立即抢救受伤人员，并迅速报告执勤的交通警察
      或者公安机关交通管理部门。因抢救受伤人员变动现场的，应当标明位置。
      乘车人、过往车辆驾驶人、过往行人应当予以协助。
    summary: |
      出了事故的正确做法：
      • 立即停车，保护现场
      • 有人受伤 → 立即救人 + 迅速报警
      • 救人移动现场 → 要标明位置
      • 绝对不能逃逸！逃逸让后果严重十倍
      记住口诀：停车、救人、报警、保护现场。第一时间拨打120和122。
    keywords: [交通事故, 现场, 报警, 救人, 逃逸, 保护现场]
    tags: [交通安全, 事故处理, 报警]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1
