# ============================================================
# 中国网络安全与个人信息保护
# ============================================================
law_name: 中华人民共和国个人信息保护法
law_name_en: Personal Information Protection Law of the PRC
category: cyber_security
country_code: CN
effective_date: 2021-11-01
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第15条"
    ref_en: "Article 15"
    title: 用户删除权
    full_text: |
      基于个人同意处理个人信息的，个人有权撤回其同意。个人信息处理者应当提供便捷的撤回同意的方式。
      个人撤回同意，不影响撤回前基于个人同意已进行的个人信息处理活动的效力。
    summary: |
      你有权撤回对 APP/网站的授权：
      • 之前点过"同意"，现在可以撤回
      • 平台必须提供方便的方式让你撤回
      • 撤回后，平台不能再处理你的信息
      比如：你注册了一个购物 APP 后不想被跟踪推荐，可以随时在设置里撤回信息收集授权。
    keywords: [个人信息, 撤回同意, 授权, 隐私, APP]
    tags: [个人信息保护, 用户权利]
    life_stage_tags: [teen, young_adult, adult, middle_age, senior]
    difficulty: 1

  - ref: "第44条"
    ref_en: "Article 44"
    title: 知情权与决定权
    full_text: |
      个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；
      法律、行政法规另有规定的除外。
    summary: |
      你的信息你做主：
      • 有权知道谁在用你的信息、怎么用
      • 有权决定是否允许使用
      • 有权限制或拒绝他人处理你的个人信息
      简单说：任何 APP 收集你的信息之前，必须明确告诉你收集什么、干什么用，并征得你同意。
    keywords: [知情权, 决定权, 个人信息, 拒绝, 限制]
    tags: [个人信息保护, 用户权利]
    life_stage_tags: [teen, young_adult, adult, middle_age, senior]
    difficulty: 1

  - ref: "第69条"
    ref_en: "Article 69"
    title: 侵权损害赔偿
    full_text: |
      处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，
      应当承担损害赔偿等侵权责任。
      前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定；
      个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，
      根据实际情况确定赔偿数额。
    summary: |
      如果你的个人信息被泄露造成损失：
      • 平台需要证明自己"没有过错"，否则就要赔偿（举证责任倒置）
      • 赔偿标准 = 你的损失 或 平台从中获利的金额
      • 如果两者都难确定，法院根据实际情况判定
      这是维权利器！比如你的信息在某个平台泄露导致诈骗，平台需要证明自己安全措施到位，否则就要赔。
    keywords: [信息泄露, 赔偿, 侵权, 损害赔偿, 举证]
    tags: [个人信息保护, 赔偿]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第34条"
    ref_en: "Article 34"
    title: 大型平台特别义务
    full_text: |
      提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，
      应当履行下列义务：（一）按照国家规定建立健全个人信息保护合规制度体系，
      成立主要由外部成员组成的独立机构对个人信息保护情况进行监督；
      （二）遵循公开、公平、公正的原则，制定平台规则，明确平台内产品或者服务
      提供者处理个人信息的规范和保护个人信息的义务...（四）定期发布个人信息保护社会责任报告，
      接受社会监督。
    summary: |
      大平台（微信/淘宝/抖音等）有额外义务：
      • 必须有独立的个人信息保护监督机构
      • 平台规则要公开公平公正
      • 要定期发布"个人信息保护社会责任报告"
      这意味着大公司不能随意对待你的数据——他们受到更严格的监管。
      如果你是大平台用户，可以查看他们的社会责任报告来了解你的数据是怎么被处理的。
    keywords: [大型平台, 个人信息保护, 监督, 社会责任, 合规]
    tags: [个人信息保护, 平台责任]
    life_stage_tags: [young_adult, adult, middle_age, senior]
    difficulty: 2

  - ref: "第28条"
    ref_en: "Article 28"
    title: 敏感个人信息
    full_text: |
      敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者
      人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、
      金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。
      只有在具有特定的目的和充分的必要性，并采取严格保护措施的情形下，
      个人信息处理者方可处理敏感个人信息。
    summary: |
      这些是"敏感个人信息"，受更严格保护：
      • 人脸、指纹（生物识别）、宗教信仰、医疗健康、金融账户、行踪轨迹
      • 以及不满14周岁未成年人的个人信息
      • 处理敏感信息需要"特定目的 + 充分必要 + 严格保护"，门槛很高
      现实提醒：APP 要求人脸识别、采集指纹，必须给出充分必要理由，不能随意强制。
    keywords: [敏感个人信息, 人脸识别, 生物识别, 医疗健康, 金融账户]
    tags: [个人信息保护, 敏感信息, 隐私]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第24条"
    ref_en: "Article 24"
    title: 自动化决策与大数据杀熟
    full_text: |
      个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，
      不得对个人在交易价格等交易条件上实行不合理的差别待遇。
      通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，
      或者向个人提供便捷的拒绝方式。
      通过自动化决策方式作出对个人权益有重大影响的决定，个人有权要求个人信息处理者予以说明，
      并有权拒绝个人信息处理者仅通过自动化决策的方式作出决定。
    summary: |
      这针对的就是"大数据杀熟"：
      • 平台不能用算法对老用户、高消费用户设置更高价格（不合理的差别待遇）
      • 个性化推荐必须提供"不针对我个人"的选项或便捷关闭方式
      • 对你有重大影响的自动化决定（如贷款审批），你有权要求人工说明和拒绝
      维权：发现"杀熟"，可以要求平台解释定价逻辑，并保留不同账号价格差异的截图证据。
    keywords: [大数据杀熟, 自动化决策, 算法, 差别待遇, 个性化推荐]
    tags: [个人信息保护, 算法, 大数据杀熟]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第31条"
    ref_en: "Article 31"
    title: 未成年人个人信息保护
    full_text: |
      个人信息处理者处理不满十四周岁未成年人个人信息的，应当取得未成年人的父母或者其他监护人的同意。
      个人信息处理者处理不满十四周岁未成年人个人信息的，应当制定专门的个人信息处理规则。
    summary: |
      孩子的个人信息受特别保护：
      • 处理不满14周岁未成年人的信息 → 必须取得父母或监护人同意
      • 平台必须制定专门的儿童信息处理规则
      现实提醒：儿童智能手表、学习类APP、游戏，都涉及未成年人信息。
      家长要注意查看 APP 是否合规收集孩子信息，是否征求了你的同意。
    keywords: [未成年人, 儿童, 个人信息, 监护人同意, 保护]
    tags: [个人信息保护, 未成年人保护]
    life_stage_tags: [childhood, teen, young_adult]
    difficulty: 1

  - ref: "第17条"
    ref_en: "Article 17"
    title: 个人信息处理告知义务
    full_text: |
      个人信息处理者在处理个人信息前，应当以显著方式、清晰易懂的语言真实、准确、完整地向个人告知下列事项：
      （一）个人信息处理者的名称或者姓名和联系方式；
      （二）个人信息的处理目的、处理方式，处理的个人信息种类、保存期限；
      （三）个人行使本法规定权利的方式和程序；
      （四）法律、行政法规规定应当告知的其他事项。
    summary: |
      平台收集你信息前必须"说清楚"：
      • 谁在收集（名称、联系方式）
      • 为什么收集、怎么用、存多久
      • 你怎么行使自己的权利（查询、更正、删除等）
      现实提醒：那些"一揽子同意"、藏在隐私政策里的小字、不读就不能用的APP，
      可能违反了告知义务。你有权要求平台明确告知，而不是默认勾选。
    keywords: [告知同意, 个人信息, 隐私政策, 知情权, APP]
    tags: [个人信息保护, 用户权利, 告知]
    life_stage_tags: [young_adult, adult, middle_age, senior]
    difficulty: 1
