articles:
  - ref: "第1047条"
    ref_en: "Article 1047"
    title: 法定婚龄
    full_text: |
      结婚年龄，男不得早于二十二周岁，女不得早于二十周岁。
    summary: |
      中国的法定结婚年龄是：男22岁、女20岁。
      这是结婚的最低年龄，低于这个年龄不能办理结婚登记。
      注意：这不等同于"建议婚龄"——法律只是规定了最低门槛。
    keywords: [婚龄, 结婚, 法定年龄, 婚姻登记]
    tags: [婚姻家庭]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第1076条"
    ref_en: "Article 1076"
    title: 离婚冷静期
    full_text: |
      夫妻双方自愿离婚的，应当签订书面离婚协议，并亲自到婚姻登记机关申请离婚登记。
      离婚协议应当载明双方自愿离婚的意思表示和对子女抚养、财产以及债务处理等事项协商一致的意见。
      自婚姻登记机关收到离婚登记申请之日起三十日内，任何一方不愿意离婚的，
      可以向婚姻登记机关撤回离婚登记申请。
      前款规定期限届满后三十日内，双方应当亲自到婚姻登记机关申请发给离婚证；
      未申请的，视为撤回离婚登记申请。
    summary: |
      协议离婚有"30天冷静期"：
      1. 双方去民政局提交离婚申请
      2. 30天内任何一方反悔都可以撤回
      3. 30天满后的30天内，双方必须亲自去领离婚证
      4. 如果没去领 → 视为撤回申请，需要重新走流程
      注意：这仅适用于协议离婚（双方自愿）。诉讼离婚不适用冷静期。
      另外，如果存在家暴等情况，建议直接走诉讼离婚，不受冷静期限制。
    keywords: [离婚, 冷静期, 协议离婚, 30天, 婚姻]
    tags: [婚姻家庭, 离婚]
    life_stage_tags: [adult, middle_age]
    difficulty: 1

  - ref: "第1062条"
    ref_en: "Article 1062"
    title: 夫妻共同财产
    full_text: |
      夫妻在婚姻关系存续期间所得的下列财产，为夫妻的共同财产，归夫妻共同所有：
      （一）工资、奖金、劳务报酬；
      （二）生产、经营、投资的收益；
      （三）知识产权的收益；
      （四）继承或者受赠的财产，但是本法第一千零六十三条第三项规定的除外；
      （五）其他应当归共同所有的财产。
      夫妻对共同财产，有平等的处理权。
    summary: |
      结婚后哪些是共同财产：
      • 工资、奖金、劳务报酬 → 共同财产
      • 做生意/投资的收益 → 共同财产
      • 知识产权收益（如专利费、版税）→ 共同财产
      • 继承或受赠的财产 → 一般也是共同财产（除非遗嘱/赠与合同明确只给一方）
      • 双方的工资卡里的钱都是共同的，不存在"谁挣的归谁"
      这在你结婚或买房时需要特别注意！
    keywords: [夫妻共同财产, 工资, 婚姻, 财产分割, 夫妻]
    tags: [婚姻家庭, 财产]
    life_stage_tags: [adult, middle_age]
    difficulty: 2

  - ref: "第1073条"
    ref_en: "Article 1073"
    title: 亲子关系异议
    full_text: |
      对亲子关系有异议且有正当理由的，父或者母可以向人民法院提起诉讼，
      请求确认或者否认亲子关系。
      对亲子关系有异议且有正当理由的，成年子女可以向人民法院提起诉讼，
      请求确认亲子关系。
    summary: |
      父母双方都可以向法院申请确认或否认亲子关系。
      成年子女也可以申请确认亲子关系（但不能申请否认）。
      这一条款保护了血缘关系的真实性，在涉及抚养权、继承权时非常关键。
    keywords: [亲子关系, 血缘, 确认, 否认, 鉴定]
    tags: [婚姻家庭, 亲子]
    life_stage_tags: [adult]
    difficulty: 2

  - ref: "第584条"
    ref_en: "Article 584"
    title: 违约损失赔偿范围
    full_text: |
      当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，
      损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；
      但是，不得超过违约方订立合同时预见到或者应当预见到的因违约可能造成的损失。
    summary: |
      签合同后对方违约了怎么办：
      • 可以要求赔偿实际损失 + 预期利益损失
      • 赔偿总额不能超过签合同时能合理预见到的损失范围
      举例：你交了5000元定金订了一个婚礼场地，结果场地方毁约。你不仅可以要回5000元定金，
      还可以要求赔偿你临时找新场地多花的费用（实际损失），以及其他合理损失。
      这提醒我们：签重要合同时一定要写清楚违约条款！
    keywords: [合同, 违约, 赔偿, 损失, 预期利益]
    tags: [合同, 违约]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第587条"
    ref_en: "Article 587"
    title: 定金罚则
    full_text: |
      债务人履行债务的，定金应当抵作价款或者收回。给付定金的一方不履行债务或者
      履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金；收受定金的一方
      不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。
    summary: |
      定金的"双倍罚则"：
      • 你交了定金但反悔不买了 → 定金不退
      • 收定金的一方反悔不卖了 → 必须双倍返还定金
      • 定金数额不能超过总价款的20%
      注意区分"定金"和"订金"：
      • 定金 → 法律保护，违约要罚
      • 订金 → 只是预付款，可以退，没有双倍罚则
      签合同时一定要注意是哪个"ding"！
    keywords: [定金, 订金, 双倍返还, 合同, 违约]
    tags: [合同, 定金, 消费者权益]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第1063条"
    ref_en: "Article 1063"
    title: 夫妻一方个人财产
    full_text: |
      下列财产为夫妻一方的个人财产：
      （一）一方的婚前财产；
      （二）一方因受到人身损害获得的赔偿或者补偿；
      （三）遗嘱或者赠与合同中确定只归一方的财产；
      （四）一方专用的生活用品；
      （五）其他应当归一方的财产。
    summary: |
      结婚后哪些财产仍归"你自己"（不是共同财产）：
      • 婚前的个人财产（如婚前买的房、存款）→ 归你
      • 因人身损害获得的赔偿（如工伤赔偿、交通事故赔偿）→ 归你
      • 遗嘱或赠与合同明确只给你的财产 → 归你
      • 你专用的生活用品（如衣物、首饰）→ 归你
      这和第1062条（共同财产）是一对：先分清"哪些是我的"、"哪些是我们的"，
      买房、结婚前一定要心里有数。
    keywords: [个人财产, 婚前财产, 夫妻, 财产分割, 民法典]
    tags: [婚姻家庭, 财产]
    life_stage_tags: [adult, middle_age]
    difficulty: 2

  - ref: "第710条"
    ref_en: "Article 710"
    title: 租赁物正常损耗不担责
    full_text: |
      承租人按照约定的方法或者根据租赁物的性质使用租赁物，
      致使租赁物受到损耗的，不承担赔偿责任。
    summary: |
      租房退押金的关键条款！
      • 只要你正常使用房子（按约定、按房子性质），造成的正常损耗
        （墙面轻微变色、地板自然磨损）→ 你不用赔
      • 房东不能以"正常损耗"为由扣押金
      • 只有因你过错造成的损坏（如故意破坏、擅自改造）才需要赔偿
      维权技巧：入住时拍视频/照片存档，记录房子的初始状态，退房时对比，防止房东讹你。
      这就是"入住拍视频"的法律意义——证明哪些是正常损耗。
    keywords: [租赁, 押金, 正常损耗, 租房, 房东, 退押金]
    tags: [合同, 租赁, 住房]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第680条"
    ref_en: "Article 680"
    title: 禁止高利放贷
    full_text: |
      禁止高利放贷，借款的利率不得违反国家有关规定。
      借款合同对支付利息没有约定的，视为没有利息。
      借款合同对支付利息约定不明确，当事人不能达成补充协议的，
      按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息；
      自然人之间借款的，视为没有利息。
    summary: |
      借钱必须知道的几点：
      • 高利贷违法，利率不能超过国家规定（司法保护上限约为LPR的4倍）
      • 没约定利息 → 视为没有利息（借多少还多少）
      • 自然人之间借款，利息约定不清 → 视为无息
      现实提醒：民间借贷、网贷、校园贷都要看清利率！超过法定上限的部分，你可以不还。
      遇到"砍头息"、"利滚利"要高度警惕。
    keywords: [高利贷, 借款, 利率, 利息, 民间借贷, 校园贷]
    tags: [合同, 借款, 利率]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第670条"
    ref_en: "Article 670"
    title: 利息不得预先扣除
    full_text: |
      借款的利息不得预先在本金中扣除。
      利息预先在本金中扣除的，应当按照实际借款数额返还借款并计算利息。
    summary: |
      警惕"砍头息"！
      • 借1万到手9000，另外1000被直接扣作利息 → 这叫"砍头息"，违法
      • 法律认定：本金按实际到手的9000算，利息也只能按9000算
      现实提醒：网贷平台常见的"服务费""手续费"先扣，实质就是砍头息，
      你有权要求按实际到手金额计算本金和利息。
    keywords: [砍头息, 借款, 利息, 本金, 网贷, 高利贷]
    tags: [合同, 借款, 利率]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第686条"
    ref_en: "Article 686"
    title: 保证方式
    full_text: |
      保证的方式包括一般保证和连带责任保证。
      当事人在保证合同中对保证方式没有约定或者约定不明确的，按照一般保证承担保证责任。
    summary: |
      给别人做担保前一定要懂：
      • 一般保证：债主必须先找借款人，还不上才能找你（你有"先诉抗辩权"）
      • 连带责任保证：债主可以直接找你，不用先找借款人
      • 没约定清楚 → 按一般保证（对你更有利）
      现实提醒：不要轻易给人做担保！"兄弟担保一下"可能让你背上几十万的债。
      民法典默认倾向保护保证人，但最好还是别随便签字担保。
    keywords: [保证, 担保, 连带责任, 一般保证, 借款]
    tags: [合同, 担保, 保证]
    life_stage_tags: [adult, middle_age]
    difficulty: 3

  - ref: "第1127条"
    ref_en: "Article 1127"
    title: 法定继承顺序
    full_text: |
      遗产按照下列顺序继承：
      （一）第一顺序：配偶、子女、父母；
      （二）第二顺序：兄弟姐妹、祖父母、外祖父母。
      继承开始后，由第一顺序继承人继承，第二顺序继承人不继承；
      没有第一顺序继承人继承的，由第二顺序继承人继承。
    summary: |
      遗产继承的先后顺序：
      • 第一顺序：配偶、子女、父母（优先继承）
      • 第二顺序：兄弟姐妹、祖父母、外祖父母（只有没有第一顺序时才轮到）
      • 有遗嘱的按遗嘱，没遗嘱的按这个法定顺序
      注意：非婚生子女、养子女、有扶养关系的继子女，和婚生子女有同等的继承权。
    keywords: [继承, 遗产, 法定继承, 配偶, 子女, 父母]
    tags: [婚姻家庭, 继承]
    life_stage_tags: [adult, middle_age, senior]
    difficulty: 2

  - ref: "第1133条"
    ref_en: "Article 1133"
    title: 遗嘱继承
    full_text: |
      自然人可以依照本法规定立遗嘱处分个人财产，并可以指定遗嘱执行人。
      自然人可以立遗嘱将个人财产指定由法定继承人中的一人或者数人继承。
      自然人可以立遗嘱将个人财产赠与国家、集体或者法定继承人以外的组织、个人。
      自然人可以依法设立遗嘱信托。
    summary: |
      你可以通过遗嘱安排自己的财产：
      • 指定法定继承人中的某一个人或几个人继承
      • 也可以赠给法定继承人以外的人（遗赠）
      • 可以设立遗嘱信托
      注意：遗嘱必须符合法定形式（自书、代书、打印、录音录像、口头、公证）才有效。
      立遗嘱是人生规划的一部分，不是"忌讳"的事。
    keywords: [遗嘱, 继承, 遗赠, 遗产, 遗嘱信托]
    tags: [婚姻家庭, 继承, 遗嘱]
    life_stage_tags: [adult, middle_age, senior]
    difficulty: 2

  - ref: "第1254条"
    ref_en: "Article 1254"
    title: 高空抛物
    full_text: |
      禁止从建筑物中抛掷物品。
      从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害的，由侵权人依法承担侵权责任；
      经调查难以确定具体侵权人的，除能够证明自己不是侵权人的外，
      由可能加害的建筑物使用人给予补偿。可能加害的建筑物使用人补偿后，有权向侵权人追偿。
      物业服务企业等建筑物管理人应当采取必要的安全保障措施防止前款规定情形的发生；
      未采取必要的安全保障措施的，应当依法承担未履行安全保障义务的侵权责任。
      公安等机关应当依法及时调查，查清责任人。
    summary: |
      高空抛物是"全楼连坐"的警示：
      • 能查明是谁扔的 → 谁承担全部责任（还可能构成刑事犯罪）
      • 查不出是谁 → 可能加害的整栋楼住户都要补偿（除非能自证清白）
      • 物业如果没装监控、没尽到防范义务 → 也要担责
      记住：从楼上扔东西不是"没素质"，是违法犯罪！高空抛物入刑（《刑法》第291条之二）。
    keywords: [高空抛物, 侵权, 赔偿, 物业, 全楼连坐]
    tags: [侵权责任, 安全, 物业]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第1245条"
    ref_en: "Article 1245"
    title: 饲养动物致害责任
    full_text: |
      饲养的动物造成他人损害的，动物饲养人或者管理人应当承担侵权责任；
      但是，能够证明损害是因被侵权人故意或者重大过失造成的，可以不承担或者减轻责任。
    summary: |
      养宠物也要担责：
      • 你的宠物（狗、猫等）伤了人 → 你（饲养人）要赔偿
      • 除非能证明是对方故意挑衅（比如主动打狗）或重大过失 → 才能免责或减责
      • 遛狗不拴绳、不戴嘴套造成伤害，几乎都是饲养人全责
      文明养宠，既是素质也是法律义务。
    keywords: [宠物, 动物致害, 侵权, 饲养人, 遛狗, 赔偿]
    tags: [侵权责任, 宠物, 安全]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第1019条"
    ref_en: "Article 1019"
    title: 肖像权保护
    full_text: |
      任何组织或者个人不得以丑化、污损，或者利用信息技术手段伪造等方式侵害他人的肖像权。
      未经肖像权人同意，不得制作、使用、公开肖像权人的肖像，但是法律另有规定的除外。
      未经肖像权人同意，肖像作品权利人不得以发表、复制、发行、出租、展览等方式使用或者公开肖像权人的肖像。
    summary: |
      你的"脸"受法律保护：
      • 未经你同意，别人不能随便用你的照片（商业用途、广告等）
      • 不能丑化、污损你的肖像，不能AI换脸伪造
      • 即使是摄影师拍了你的照片，未经你同意也不能随意发表、展览
      现实提醒：商家未经同意用顾客照片做宣传、盗用他人照片做头像，都侵害肖像权。
      发现被侵权可以要求停止使用、删除、赔礼道歉、赔偿损失。
    keywords: [肖像权, 照片, 隐私, AI换脸, 未经同意]
    tags: [人格权, 肖像权, 隐私]
    life_stage_tags: [young_adult, adult, teen]
    difficulty: 2

  - ref: "第1024条"
    ref_en: "Article 1024"
    title: 名誉权保护
    full_text: |
      民事主体享有名誉权。任何组织或者个人不得以侮辱、诽谤等方式侵害他人的名誉权。
      名誉是对民事主体的品德、声望、才能、信用等的社会评价。
    summary: |
      名誉权保护你的"社会名声"：
      • 别人不能以侮辱、诽谤等方式损害你的名誉
      • 名誉 = 社会对你的品德、声望、才能、信用的评价
      现实提醒：网上造谣、恶意辱骂、传播不实信息损害他人名誉，都可能构成名誉侵权。
      维权：可以要求停止侵害、删除、消除影响、赔礼道歉、赔偿精神损失。
      同时也要注意：你自己在网上发言也要实事求是，避免侵害他人名誉权。
    keywords: [名誉权, 诽谤, 侮辱, 网络暴力, 造谣]
    tags: [人格权, 名誉权, 网络暴力]
    life_stage_tags: [young_adult, adult, teen]
    difficulty: 1

  - ref: "第1032条"
    ref_en: "Article 1032"
    title: 隐私权保护
    full_text: |
      自然人享有隐私权。任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。
      隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息。
    summary: |
      你的隐私受法律明确保护：
      • 别人不能刺探、侵扰、泄露、公开你的隐私
      • 隐私包括：私人生活安宁、私密空间（如房间）、私密活动、私密信息（如聊天记录、日记）
      现实提醒：偷拍偷窥、翻看他人手机、曝光他人住址和身份证号、安装针孔摄像头，
      都是侵害隐私权。网络时代更要保护好自己和他人的隐私。
    keywords: [隐私权, 偷拍, 泄露, 个人信息, 私密空间]
    tags: [人格权, 隐私权]
    life_stage_tags: [young_adult, adult, teen]
    difficulty: 1

  - ref: "第145条"
    ref_en: "Article 145"
    title: 限制民事行为能力人实施的民事法律行为
    full_text: |
      限制民事行为能力人实施的纯获利益的民事法律行为或者与其年龄、智力、
      精神健康状况相适应的民事法律行为有效；实施的其他民事法律行为
      经法定代理人同意或者追认后有效。
      相对人可以催告法定代理人自收到通知之日起三十日内予以追认。
      法定代理人未作表示的，视为拒绝追认。民事法律行为被追认前，
      善意相对人有撤销的权利。撤销应当以通知的方式作出。
    summary: |
      未成年人（8-18岁）花钱的效力规则：
      • 纯获利的行为（如收礼物）→ 有效
      • 与年龄智力相适应的行为（如买文具、零食）→ 有效
      • 与年龄智力不相适应的行为（如大额游戏充值）→ 需父母同意或追认，父母不追认则无效
      • 父母拒绝追认 → 商家应退款
      这就是"未成年人大额充值可退款"的核心法律依据！8岁以下是无民事行为能力人，行为一律无效。
    keywords: [限制民事行为能力, 未成年人, 游戏充值, 追认, 退款, 民事行为能力]
    tags: [民事主体, 未成年人, 合同效力]
    life_stage_tags: [childhood, teen, young_adult]
    difficulty: 2

  - ref: "第1067条"
    ref_en: "Article 1067"
    title: 抚养与赡养义务
    full_text: |
      父母不履行抚养义务的，未成年子女或者不能独立生活的成年子女，
      有要求父母给付抚养费的权利。
      成年子女不履行赡养义务的，缺乏劳动能力或者生活困难的父母，
      有要求成年子女给付赡养费的权利。
    summary: |
      抚养与赡养是双向的法律义务：
      • 父母不养孩子 → 孩子有权要求抚养费
      • 成年子女不赡养父母 → 缺乏劳动能力或生活困难的父母有权要求赡养费
      • 这是法定义务，不是"看心情"，不履行可以起诉
      现实意义：赡养老人是子女的法定义务，"久病床前无孝子"在法律上是说不通的。
      同样，父母遗弃子女也是违法的。
    keywords: [赡养, 抚养, 赡养费, 抚养费, 父母, 子女]
    tags: [婚姻家庭, 赡养, 抚养]
    life_stage_tags: [adult, middle_age, senior]
    difficulty: 2
