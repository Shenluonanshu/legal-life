articles:
  - ref: "第1047条"
    ref_en: "Article 1047"
    title: 法定婚龄
    full_text: |
      结婚年龄，男不得早于二十二周岁，女不得早于二十周岁。
    summary: |
      中国的法定结婚年龄是：男22岁、女20岁。
      这是结婚的最低年龄，低于这个年龄不能办理结婚登记。
      注意：这不等同于"建议婚龄"——法律只是规定了最低门槛。
    keywords: [婚龄, 结婚, 法定年龄, 婚姻登记]
    tags: [婚姻家庭]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第1076条"
    ref_en: "Article 1076"
    title: 离婚冷静期
    full_text: |
      夫妻双方自愿离婚的，应当签订书面离婚协议，并亲自到婚姻登记机关申请离婚登记。
      离婚协议应当载明双方自愿离婚的意思表示和对子女抚养、财产以及债务处理等事项协商一致的意见。
      自婚姻登记机关收到离婚登记申请之日起三十日内，任何一方不愿意离婚的，
      可以向婚姻登记机关撤回离婚登记申请。
      前款规定期限届满后三十日内，双方应当亲自到婚姻登记机关申请发给离婚证；
      未申请的，视为撤回离婚登记申请。
    summary: |
      协议离婚有"30天冷静期"：
      1. 双方去民政局提交离婚申请
      2. 30天内任何一方反悔都可以撤回
      3. 30天满后的30天内，双方必须亲自去领离婚证
      4. 如果没去领 → 视为撤回申请，需要重新走流程
      注意：这仅适用于协议离婚（双方自愿）。诉讼离婚不适用冷静期。
      另外，如果存在家暴等情况，建议直接走诉讼离婚，不受冷静期限制。
    keywords: [离婚, 冷静期, 协议离婚, 30天, 婚姻]
    tags: [婚姻家庭, 离婚]
    life_stage_tags: [adult, middle_age]
    difficulty: 1

  - ref: "第1062条"
    ref_en: "Article 1062"
    title: 夫妻共同财产
    full_text: |
      夫妻在婚姻关系存续期间所得的下列财产，为夫妻的共同财产，归夫妻共同所有：
      （一）工资、奖金、劳务报酬；
      （二）生产、经营、投资的收益；
      （三）知识产权的收益；
      （四）继承或者受赠的财产，但是本法第一千零六十三条第三项规定的除外；
      （五）其他应当归共同所有的财产。
      夫妻对共同财产，有平等的处理权。
    summary: |
      结婚后哪些是共同财产：
      • 工资、奖金、劳务报酬 → 共同财产
      • 做生意/投资的收益 → 共同财产
      • 知识产权收益（如专利费、版税）→ 共同财产
      • 继承或受赠的财产 → 一般也是共同财产（除非遗嘱/赠与合同明确只给一方）
      • 双方的工资卡里的钱都是共同的，不存在"谁挣的归谁"
      这在你结婚或买房时需要特别注意！
    keywords: [夫妻共同财产, 工资, 婚姻, 财产分割, 夫妻]
    tags: [婚姻家庭, 财产]
    life_stage_tags: [adult, middle_age]
    difficulty: 2

  - ref: "第1073条"
    ref_en: "Article 1073"
    title: 亲子关系异议
    full_text: |
      对亲子关系有异议且有正当理由的，父或者母可以向人民法院提起诉讼，
      请求确认或者否认亲子关系。
      对亲子关系有异议且有正当理由的，成年子女可以向人民法院提起诉讼，
      请求确认亲子关系。
    summary: |
      父母双方都可以向法院申请确认或否认亲子关系。
      成年子女也可以申请确认亲子关系（但不能申请否认）。
      这一条款保护了血缘关系的真实性，在涉及抚养权、继承权时非常关键。
    keywords: [亲子关系, 血缘, 确认, 否认, 鉴定]
    tags: [婚姻家庭, 亲子]
    life_stage_tags: [adult]
    difficulty: 2

  - ref: "第584条"
    ref_en: "Article 584"
    title: 违约损失赔偿范围
    full_text: |
      当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，
      损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；
      但是，不得超过违约方订立合同时预见到或者应当预见到的因违约可能造成的损失。
    summary: |
      签合同后对方违约了怎么办：
      • 可以要求赔偿实际损失 + 预期利益损失
      • 赔偿总额不能超过签合同时能合理预见到的损失范围
      举例：你交了5000元定金订了一个婚礼场地，结果场地方毁约。你不仅可以要回5000元定金，
      还可以要求赔偿你临时找新场地多花的费用（实际损失），以及其他合理损失。
      这提醒我们：签重要合同时一定要写清楚违约条款！
    keywords: [合同, 违约, 赔偿, 损失, 预期利益]
    tags: [合同, 违约]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第587条"
    ref_en: "Article 587"
    title: 定金罚则
    full_text: |
      债务人履行债务的，定金应当抵作价款或者收回。给付定金的一方不履行债务或者
      履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金；收受定金的一方
      不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。
    summary: |
      定金的"双倍罚则"：
      • 你交了定金但反悔不买了 → 定金不退
      • 收定金的一方反悔不卖了 → 必须双倍返还定金
      • 定金数额不能超过总价款的20%
      注意区分"定金"和"订金"：
      • 定金 → 法律保护，违约要罚
      • 订金 → 只是预付款，可以退，没有双倍罚则
      签合同时一定要注意是哪个"ding"！
    keywords: [定金, 订金, 双倍返还, 合同, 违约]
    tags: [合同, 定金, 消费者权益]
    life_stage_tags: [young_adult, adult]
    difficulty: 1
