# ============================================================
# 中华人民共和国刑法（核心条款摘要）
# 聚焦与日常生活密切相关的条款
# ============================================================
law_name: 中华人民共和国刑法
law_name_en: Criminal Law of the People's Republic of China
category: criminal
country_code: CN
effective_date: 1997-10-01
last_amended: 2020-12-26
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第17条"
    ref_en: "Article 17"
    title: 刑事责任年龄
    full_text: |
      已满十六周岁的人犯罪，应当负刑事责任。
      已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、
      抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。
      已满十二周岁不满十四周岁的人，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍
      手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。
      对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处罚。
      因不满十六周岁不予刑事处罚的，责令其父母或者其他监护人加以管教；在必要的时候，
      依法进行专门矫治教育。
    summary: |
      刑事责任年龄分三级：
      • 满16岁 → 对所有犯罪承担刑事责任
      • 14-16岁 → 只对8种严重犯罪负责（杀人、伤害致死、强奸、抢劫、贩毒、放火、爆炸、危险物质）
      • 12-14岁 → 只有在犯故意杀人/伤害致死且情节特别恶劣，经最高检核准后才追究刑事责任
      • 不满18岁的未成年人 → 应当从轻或减轻处罚
      这个条款在校园场景中非常重要——未成年人也要为自己的行为承担法律后果。
    keywords: [刑事责任, 年龄, 未成年人, 犯罪, 校园, 青少年]
    tags: [刑事责任, 未成年人保护]
    life_stage_tags: [teen, young_adult]
    difficulty: 1

  - ref: "第234条"
    ref_en: "Article 234"
    title: 故意伤害罪
    full_text: |
      故意伤害他人身体的，处三年以下有期徒刑、拘役或者管制。
      犯前款罪，致人重伤的，处三年以上十年以下有期徒刑；
      致人死亡或者以特别残忍手段致人重伤造成严重残疾的，处十年以上有期徒刑、无期徒刑或者死刑。
      本法另有规定的，依照规定。
    summary: |
      故意伤害罪量刑分三档：
      • 轻伤 → 3年以下（有期徒刑/拘役/管制）
      • 重伤 → 3-10年
      • 致死/特别残忍致重伤残疾 → 10年以上至死刑
      生活中需要特别注意：打架斗殴看似"小事"，一旦造成轻伤以上后果就可能构成犯罪。
      即使是同学之间的"推搡"，如果导致对方受伤，可能面临刑事追诉。
    keywords: [故意伤害, 打架, 重伤, 轻伤, 刑事责任]
    tags: [暴力犯罪, 人身安全]
    life_stage_tags: [teen, young_adult]
    difficulty: 1

  - ref: "第264条"
    ref_en: "Article 264"
    title: 盗窃罪
    full_text: |
      盗窃公私财物，数额较大的，或者多次盗窃、入户盗窃、携带凶器盗窃、扒窃的，
      处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；
      数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；
      数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，
      并处罚金或者没收财产。
    summary: |
      盗窃不是小事！量刑取决于金额和情节：
      • 数额较大（一般1000-3000元以上）→ 3年以下
      • 数额巨大（一般3万-10万以上）→ 3-10年
      • 数额特别巨大（一般30万-50万以上）→ 10年至无期
      特别提醒：多次盗窃（2年内3次以上）、入户盗窃、扒窃等，即使金额不大也可能构成犯罪。
    keywords: [盗窃, 偷窃, 财物, 刑事责任, 入室盗窃]
    tags: [财产犯罪]
    life_stage_tags: [teen, young_adult, adult]
    difficulty: 1

  - ref: "第253条之一"
    ref_en: "Article 253(1)"
    title: 侵犯公民个人信息罪
    full_text: |
      违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，
      处三年以下有期徒刑或者拘役，并处或者单处罚金；
      情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。
      违反国家有关规定，将在履行职责或者提供服务过程中获得的公民个人信息，
      出售或者提供给他人的，依照前款的规定从重处罚。
      窃取或者以其他方法非法获取公民个人信息的，依照第一款的规定处罚。
    summary: |
      这个条款和每个人的隐私息息相关：
      • 出售/提供他人个人信息 → 情节严重可判3年以下
      • 情节特别严重 → 3-7年
      • 如果是利用职务便利（如在公司/机构工作时获取的信息）→ 从重处罚
      • 非法获取他人信息同样构成犯罪
      注意：倒卖手机号、身份证号、住址等个人信息都是违法的。APP 违规收集你的信息也可以依据此条追责。
    keywords: [个人信息, 隐私, 数据安全, 出售信息, 网络安全]
    tags: [网络安全, 个人信息保护]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第293条"
    ref_en: "Article 293"
    title: 寻衅滋事罪
    full_text: |
      有下列寻衅滋事行为之一，破坏社会秩序的，处五年以下有期徒刑、拘役或者管制：
      （一）随意殴打他人，情节恶劣的；
      （二）追逐、拦截、辱骂、恐吓他人，情节恶劣的；
      （三）强拿硬要或者任意损毁、占用公私财物，情节严重的；
      （四）在公共场所起哄闹事，造成公共场所秩序严重混乱的。
      纠集他人多次实施前款行为，严重破坏社会秩序的，处五年以上十年以下有期徒刑，
      可以并处罚金。
    summary: |
      这个条款俗称"口袋罪"，覆盖多种扰乱社会秩序的行为：
      • 随意打人（情节恶劣）
      • 追逐拦截辱骂恐吓（如网络暴力延伸至线下）
      • 强拿硬要或任意毁坏财物
      • 公共场所闹事造成严重混乱
      量刑：一般5年以下；纠集多人多次的5-10年。
      生活中容易被忽视的场景：酒后闹事、夜市打架、网络约架——都可能触犯此条。
    keywords: [寻衅滋事, 打架斗殴, 公共场所秩序, 闹事]
    tags: [公共秩序, 暴力行为]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第266条"
    ref_en: "Article 266"
    title: 诈骗罪
    full_text: |
      诈骗公私财物，数额较大的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；
      数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，并处罚金；
      数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，
      并处罚金或者没收财产。本法另有规定的，依照规定。
    summary: |
      电信诈骗、网络诈骗都适用这条：
      • 数额较大（各地标准不同，一般3000-1万以上）→ 3年以下
      • 数额巨大（一般3万-10万以上）→ 3-10年
      • 数额特别巨大（一般50万以上）→ 10年以上至无期
      防骗提醒：任何"刷单返利""冒充客服退款""杀猪盘""虚假投资"都是诈骗套路。
      记住"三不一多"：不轻信、不透露、不转账、多核实。
    keywords: [诈骗, 电信诈骗, 网络诈骗, 杀猪盘, 刷单, 防骗]
    tags: [财产犯罪, 诈骗, 网络安全]
    life_stage_tags: [young_adult, adult, middle_age, senior]
    difficulty: 1

  - ref: "第287条之二"
    ref_en: "Article 287(2)"
    title: 帮助信息网络犯罪活动罪
    full_text: |
      明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、
      通讯传输等技术支持，或者提供广告推广、支付结算等帮助，情节严重的，
      处三年以下有期徒刑或者拘役，并处或者单处罚金。
    summary: |
      简称"帮信罪"，近年高发，务必警惕：
      • 明知别人用网络犯罪，还提供技术支持、支付结算等帮助 → 构成犯罪
      • 现实中最常见的：出租、出借、出售自己的银行卡、电话卡、支付账户给他人
      • 哪怕你"只是借张卡"赚点小钱，也可能被判刑
      提醒：不要出借、出售自己的银行卡、手机卡、微信/支付宝账户！"跑分"是犯罪。
    keywords: [帮信罪, 银行卡, 跑分, 出借账户, 电信诈骗, 洗钱]
    tags: [网络安全, 财产犯罪, 帮信罪]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第133条之一"
    ref_en: "Article 133(1)"
    title: 危险驾驶罪
    full_text: |
      在道路上驾驶机动车，有下列情形之一的，处拘役，并处罚金：
      （一）追逐竞驶，情节恶劣的；
      （二）醉酒驾驶机动车的；
      （三）从事校车业务或者旅客运输，严重超过额定乘员载客，
      或者严重超过规定时速行驶的；
      （四）违反危险化学品安全管理规定运输危险化学品，危及公共安全的。
    summary: |
      醉驾入刑！这是"醉驾"的刑事法律依据：
      • 醉酒驾驶（血液酒精含量≥80mg/100ml）→ 处拘役 + 罚金，构成刑事犯罪
      • 追逐竞驶（飙车）情节恶劣 → 同样入刑
      • 校车/客运超载超速、违规运危化品 → 入刑
      记住：醉驾不是"交通违法"那么简单，是会留刑事案底的犯罪，
      影响考公、参军、子女政审等。喝酒绝对不开车。
    keywords: [醉驾, 危险驾驶, 飙车, 入刑, 拘役, 酒驾]
    tags: [交通安全, 刑事责任, 醉驾]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第274条"
    ref_en: "Article 274"
    title: 敲诈勒索罪
    full_text: |
      敲诈勒索公私财物，数额较大或者多次敲诈勒索的，处三年以下有期徒刑、拘役或者管制，
      并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，
      并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑，并处罚金。
    summary: |
      敲诈勒索不是"小事"：
      • 以威胁、要挟手段索要财物 → 构成敲诈勒索
      • 多次敲诈（即使每次金额不大）→ 也构成犯罪
      现实提醒：网上的"裸聊敲诈"、以曝光隐私相要挟索要钱财，都是典型敲诈勒索。
      遇到这种情况不要妥协转账，应立即报警并保留证据。
    keywords: [敲诈勒索, 威胁, 裸聊, 曝光隐私, 要挟]
    tags: [财产犯罪, 敲诈勒索]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第275条"
    ref_en: "Article 275"
    title: 故意毁坏财物罪
    full_text: |
      故意毁坏公私财物，数额较大或者有其他严重情节的，
      处三年以下有期徒刑、拘役或者罚金；
      数额巨大或者有其他特别严重情节的，处三年以上七年以下有期徒刑。
    summary: |
      故意砸坏、毁坏他人财物也是犯罪：
      • 故意毁坏他人财物，数额较大（一般5000元以上）→ 构成犯罪
      • 数额巨大 → 3-7年
      现实提醒：情绪激动时砸车、砸店、砸人手机，都可能触犯此罪。
      一时冲动赔钱又可能坐牢，得不偿失。控制情绪，用合法方式解决纠纷。
    keywords: [故意毁坏, 财物, 砸车, 毁坏财物, 冲动]
    tags: [财产犯罪, 毁坏财物]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第312条"
    ref_en: "Article 312"
    title: 掩饰隐瞒犯罪所得
    full_text: |
      明知是犯罪所得及其产生的收益而予以窝藏、转移、收购、代为销售或者以其他方法掩饰、
      隐瞒的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；
      情节严重的，处三年以上七年以下有期徒刑，并处罚金。
    summary: |
      "帮忙处理赃物"也是犯罪：
      • 明知是赃物还帮忙藏匿、转移、收购、代卖 → 构成犯罪
      • 情节严重 → 3-7年
      现实提醒：明显低于市场价的"赃物"不要买（如低价手机、电动车）；
      别人让你帮忙"洗钱""转账"更不能碰。贪小便宜可能触犯刑法。
    keywords: [掩饰隐瞒, 赃物, 洗钱, 收购赃物, 犯罪所得]
    tags: [财产犯罪, 洗钱, 掩饰隐瞒]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第217条"
    ref_en: "Article 217"
    title: 侵犯著作权罪
    full_text: |
      以营利为目的，未经著作权人许可，复制发行、通过信息网络向公众传播其文字作品、
      音乐、美术、视听作品、计算机软件及法律、行政法规规定的其他作品，
      违法所得数额较大或者有其他严重情节的，处三年以下有期徒刑，并处或者单处罚金；
      违法所得数额巨大或者有其他特别严重情节的，处三年以上十年以下有期徒刑，并处罚金。
    summary: |
      盗版、搬运也可能构成犯罪：
      • 以营利为目的，未经许可复制、传播他人作品（文字、音乐、影视、软件等）
      • 违法所得数额较大 → 构成犯罪
      现实提醒：做"搬运号"、盗录电影、售卖盗版软件，都可能触犯此罪。
      尊重版权，创作和传播都要在法律框架内。
    keywords: [著作权, 盗版, 版权, 搬运, 侵权, 盗录]
    tags: [财产犯罪, 知识产权, 版权]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第263条"
    ref_en: "Article 263"
    title: 抢劫罪
    full_text: |
      以暴力、胁迫或者其他方法抢劫公私财物的，处三年以上十年以下有期徒刑，并处罚金；
      有下列情形之一的，处十年以上有期徒刑、无期徒刑或者死刑，并处罚金或者没收财产：
      （一）入户抢劫的；
      （二）在公共交通工具上抢劫的；
      （三）抢劫银行或者其他金融机构的；
      （四）多次抢劫或者抢劫数额巨大的；
      （五）抢劫致人重伤、死亡的；
      （六）冒充军警人员抢劫的；
      （七）持枪抢劫的；
      （八）抢劫军用物资或者抢险、救灾、救济物资的。
    summary: |
      抢劫是重罪：
      • 一般抢劫 → 3-10年 + 罚金
      • 入户、公交、银行、持枪、致人伤亡等8种加重情形 → 10年以上至死刑
      现实提醒：抢劫和抢夺不同——抢劫用了暴力/胁迫压制反抗，性质更严重。
      遭遇抢劫，人身安全第一，记住特征、事后立即报警。
    keywords: [抢劫, 暴力, 入户抢劫, 抢夺, 重罪]
    tags: [财产犯罪, 暴力犯罪, 抢劫]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第267条"
    ref_en: "Article 267"
    title: 抢夺罪
    full_text: |
      抢夺公私财物，数额较大的，或者多次抢夺的，处三年以下有期徒刑、拘役或者管制，
      并处或者单处罚金；数额巨大或者有其他严重情节的，处三年以上十年以下有期徒刑，
      并处罚金；数额特别巨大或者有其他特别严重情节的，处十年以上有期徒刑或者无期徒刑，
      并处罚金或者没收财产。
      携带凶器抢夺的，依照本法第二百六十三条的规定定罪处罚。
    summary: |
      抢夺与抢劫的区别：
      • 抢夺 = 乘人不备公然夺取财物（如飞车抢包）
      • 抢劫 = 用暴力、胁迫压制反抗（更严重）
      • ★ 携带凶器抢夺 → 按抢劫罪定罪（更重）
      现实提醒：飞车抢夺、街头抢手机都是抢夺罪。女性单独夜行要保管好包和手机，
      遇到抢夺记住嫌疑人特征和车辆信息，及时报警。
    keywords: [抢夺, 飞车抢包, 抢夺罪, 街头抢夺, 凶器]
    tags: [财产犯罪, 抢夺, 暴力犯罪]
    life_stage_tags: [young_adult, adult]
    difficulty: 1
