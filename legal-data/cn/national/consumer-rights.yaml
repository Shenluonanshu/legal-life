# ============================================================
# 中国消费者权益保护法律法规
# ============================================================
law_name: 中华人民共和国消费者权益保护法
law_name_en: Law on the Protection of Consumer Rights and Interests
category: consumer_rights
country_code: CN
effective_date: 1994-01-01
last_amended: 2013-10-25
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第55条"
    ref_en: "Article 55"
    title: 欺诈行为的三倍赔偿
    full_text: |
      经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，
      增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；
      增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。
      经营者明知商品或者服务存在缺陷，仍然向消费者提供，造成消费者或者其他受害人
      死亡或者健康严重损害的，受害人有权要求经营者依照本法第四十九条、第五十一条等
      法律规定赔偿损失，并有权要求所受损失二倍以下的惩罚性赔偿。
    summary: |
      简单来说，商家存在欺诈行为时：
      • 可以要求"退一赔三"——退还货款，再赔偿3倍金额
      • 如果3倍金额不到500元，直接赔500元（最低保障）
      • 如果商家明知商品有缺陷还卖，造成严重伤害的，可以要求更高赔偿
      举例：你花了200元买到假货，商家要退你200元+赔你600元=总共拿回800元。
    keywords: [消费者权益, 假一赔三, 欺诈, 赔偿, 退一赔三]
    tags: [消费者权利, 欺诈, 赔偿]
    life_stage_tags: [young_adult, adult, middle_age, teen]
    difficulty: 1

  - ref: "第25条"
    ref_en: "Article 25"
    title: 网购七天无理由退货
    full_text: |
      经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起
      七日内退货，且无需说明理由，但下列商品除外：
      （一）消费者定作的；
      （二）鲜活易腐的；
      （三）在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；
      （四）交付的报纸、期刊。
      除前款所列商品外，其他根据商品性质并经消费者在购买时确认不宜退货的商品，
      不适用无理由退货。消费者退货的商品应当完好。
      经营者应当自收到退回商品之日起七日内返还消费者支付的商品价款。
      退回商品的运费由消费者承担；经营者和消费者另有约定的，按照约定。
    summary: |
      网购商品可以"7天无理由退货"，但要注意：
      • 从收到商品起7天内可以退货，不需要任何理由
      • 但有例外：定做的、生鲜易腐的、下载的数字化商品、报纸期刊不能退
      • 退货的商品必须完好，不影响二次销售
      • 退货运费一般由你出（除非商家包退货运费）
      • 商家收到退货后7天内必须退款
      这个条款对网购达人非常重要！
    keywords: [七天无理由, 网购, 退货, 退款, 消费者权益]
    tags: [消费者权利, 网购]
    life_stage_tags: [young_adult, adult, teen]
    difficulty: 1

  - ref: "第23条"
    ref_en: "Article 23"
    title: 经营者质量保证义务
    full_text: |
      经营者应当保证在正常使用商品或者接受服务的情况下其提供的商品或者服务应当具有的质量、
      性能、用途和有效期限；但消费者在购买该商品或者接受该服务前已经知道其存在瑕疵，
      且存在该瑕疵不违反法律强制性规定的除外。
      经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，
      消费者自接受商品或者服务之日起六个月内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。
    summary: |
      商家必须保证商品质量。重点是：
      • 购买耐用商品（车、电脑、家电等）6个月内发现瑕疵
      • 如果发生争议 → 商家负责证明产品没问题（举证责任倒置）
      • 也就是说你不用自己去找证据证明商品有问题，商家需要证明商品没问题
      这大大减轻了消费者的维权难度。
    keywords: [质量保证, 举证责任, 耐用商品, 消费者权益]
    tags: [消费者权利, 质量保证]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第53条"
    ref_en: "Article 53"
    title: 预付卡消费
    full_text: |
      经营者以预收款方式提供商品或者服务的，应当按照约定提供。
      未按照约定提供的，应当按照消费者的要求履行约定或者退回预付款；
      并应当承担预付款的利息、消费者必须支付的合理费用。
    summary: |
      办卡充值（预付卡）要谨慎！法律规定：
      • 商家收了预付款，就必须按约定提供服务
      • 如果商家不履约（比如健身房跑路）→ 你可以要求：
        1. 继续履行约定，或
        2. 退回预付款
      • 商家还要承担预付款的利息和你的合理损失
      现实提醒：办卡前查一下商家是否备案、是否频繁换招牌。预付卡金额越大，风险越高。
      一旦跑路，记得保留合同和转账凭证，这是维权关键。
    keywords: [预付卡, 预付款, 办卡, 充值, 跑路, 退费]
    tags: [消费者权利, 预付卡, 预付费]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第29条"
    ref_en: "Article 29"
    title: 经营者收集个人信息
    full_text: |
      经营者收集、使用消费者个人信息，应当遵循合法、正当、必要的原则，
      明示收集、使用信息的目的、方式和范围，并经消费者同意。
      经营者收集、使用消费者个人信息，应当公开其收集、使用规则，
      不得违反法律、法规的规定和双方的约定收集、使用信息。
    summary: |
      商家收集你的个人信息有"三原则"：
      • 合法、正当、必要——不能想收什么就收什么
      • 必须明示目的、方式、范围，并经你同意
      • 不能违反约定收集使用
      现实意义：扫码点餐强制要手机号、注册会员要身份证号——如果与消费无关且未明确告知，
      都可以拒绝。个人信息不是商家的"赠品"。
    keywords: [个人信息, 隐私, 收集, 消费者, 明示同意]
    tags: [消费者权利, 个人信息, 隐私]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第26条"
    ref_en: "Article 26"
    title: 不公平格式条款无效
    full_text: |
      经营者在经营活动中使用格式条款的，应当以显著方式提请消费者注意商品或者服务的
      数量和质量、价款或者费用、履行期限和方式、安全注意事项和风险警示、售后服务、
      民事责任等与消费者有重大利害关系的内容，并按照消费者的要求予以说明。
      经营者不得以格式条款、通知、声明、店堂告示等方式，作出排除或者限制消费者权利、
      减轻或者免除经营者责任、加重消费者责任等对消费者不公平、不合理的规定，
      不得利用格式条款并借助技术手段强制交易。
      格式条款、通知、声明、店堂告示等含有前款所列内容的，其内容无效。
    summary: |
      那些"霸王条款"其实无效！
      • "最终解释权归本店所有" → 无效
      • "本店商品一经售出概不退换" → 无效（除非法定例外）
      • "贵重物品丢失概不负责" → 无效
      • "禁止自带酒水"、"包间最低消费" → 不公平格式条款
      记住：任何单方面排除你权利、加重你责任的条款，即使你签了字、扫了码，也是无效的。
    keywords: [格式条款, 霸王条款, 无效, 最终解释权, 消费者权利]
    tags: [消费者权利, 格式条款, 霸王条款]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "第19条"
    ref_en: "Article 19"
    title: 缺陷产品召回
    full_text: |
      经营者发现其提供的商品或者服务存在缺陷，有危及人身、财产安全危险的，
      应当立即向有关行政部门报告和告知消费者，并采取停止销售、警示、召回、
      无害化处理、销毁、停止生产或者服务等措施。
      采取召回措施的，经营者应当承担消费者因商品被召回支出的必要费用。
    summary: |
      商品有缺陷危及安全时，商家必须主动处理：
      • 立即报告、告知消费者
      • 采取停止销售、警示、召回等措施
      • 消费者因召回产生的必要费用由商家承担
      现实意义：你买的汽车、家电如果被列入召回名单，商家应主动联系你，
      你配合召回产生的费用（如拖车费）可以要求商家承担。
    keywords: [缺陷产品, 召回, 安全, 商品质量, 消费者]
    tags: [消费者权利, 产品安全, 召回]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第20条"
    ref_en: "Article 20"
    title: 明码标价与真实宣传
    full_text: |
      经营者向消费者提供有关商品或者服务的质量、性能、用途、有效期限等信息，
      应当真实、全面，不得作虚假或者引人误解的宣传。
      经营者对消费者就其提供的商品或者服务的质量和使用方法等问题提出的询问，
      应当作出真实、明确的答复。
      经营者提供商品或者服务应当明码标价。
    summary: |
      商家必须"如实相告"：
      • 商品信息要真实、全面，不能虚假宣传、夸大效果
      • 你对商品的询问，商家必须真实明确答复
      • 必须明码标价，不能"看人下菜碟"
      现实提醒：直播间里"全网最低价""秒杀"如果与实际不符，属于虚假宣传，
      可以依据消保法要求赔偿。留好直播录屏和商品页截图作证据。
    keywords: [明码标价, 虚假宣传, 真实信息, 直播带货, 消费者]
    tags: [消费者权利, 明码标价, 虚假宣传]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第24条"
    ref_en: "Article 24"
    title: 三包责任
    full_text: |
      经营者提供的商品或者服务不符合质量要求的，消费者可以依照国家规定、当事人约定退货，
      或者要求经营者履行更换、修理等义务。
      没有国家规定和当事人约定的，消费者可以自收到商品之日起七日内退货；
      七日后符合法定解除合同条件的，消费者可以及时退货，不符合法定解除合同条件的，
      可以要求经营者履行更换、修理等义务。
      依照前款规定进行退货、更换、修理的，经营者应当承担运输等必要费用。
    summary: |
      商品有问题，你的权利（"三包"）：
      • 质量不符 → 可退货，或要求更换、修理
      • 没有特殊约定 → 7日内可以退货
      • 7日后符合条件的仍可退货，否则要求换货、修理
      • 退货/换货/修理的运输费由商家承担
      现实提醒：手机、家电等都有"三包"规定，别被"只能修不能退"忽悠。
      质量问题在保修期内，修理是商家义务，不能额外收费。
    keywords: [三包, 退货, 换货, 修理, 质量, 保修]
    tags: [消费者权利, 三包, 售后]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "第11条"
    ref_en: "Article 11"
    title: 消费者损害赔偿请求权
    full_text: |
      消费者因购买、使用商品或者接受服务受到人身、财产损害的，享有依法获得赔偿的权利。
    summary: |
      商品或服务造成损害，你有权索赔：
      • 买到问题商品造成人身损害（如漏电受伤）→ 索赔
      • 造成财产损失（如劣质充电器烧了设备）→ 索赔
      • 这是消费者的基本权利
      现实提醒：保留购物凭证、医疗记录、财产损失证明。人身伤害可以主张医疗费、误工费、精神损害赔偿等。
    keywords: [损害赔偿, 人身损害, 财产损失, 索赔, 消费者权利]
    tags: [消费者权利, 赔偿, 人身安全]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1
