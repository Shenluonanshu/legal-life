# ============================================================
# 中国劳动法律法规
# ============================================================
law_name: 中华人民共和国劳动合同法
law_name_en: Labor Contract Law of the People's Republic of China
category: employment
country_code: CN
effective_date: 2008-01-01
last_amended: 2012-12-28
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第19条"
    ref_en: "Article 19"
    title: 试用期期限
    full_text: |
      劳动合同期限三个月以上不满一年的，试用期不得超过一个月；
      劳动合同期限一年以上不满三年的，试用期不得超过二个月；
      三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月。
      同一用人单位与同一劳动者只能约定一次试用期。
      以完成一定工作任务为期限的劳动合同或者劳动合同期限不满三个月的，不得约定试用期。
      试用期包含在劳动合同期限内。劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。
    summary: |
      简单来说，签合同时试用期的长度取决于合同期限：
      • 合同不满1年 → 试用期最多1个月
      • 合同1-3年 → 试用期最多2个月
      • 合同3年以上 → 试用期最多6个月
      • 同一家公司对同一个人只能约定一次试用期
      • 试用期是包含在合同期内的，不能单独签试用期合同
    keywords: [劳动合同, 试用期, 期限, 毕业生, 求职]
    tags: [劳动者权利, 入职]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第39条"
    ref_en: "Article 39"
    title: 用人单位单方解除劳动合同
    full_text: |
      劳动者有下列情形之一的，用人单位可以解除劳动合同：
      （一）在试用期间被证明不符合录用条件的；
      （二）严重违反用人单位的规章制度的；
      （三）严重失职，营私舞弊，给用人单位造成重大损害的；
      （四）劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出，拒不改正的；
      （五）因本法第二十六条第一款第一项规定的情形致使劳动合同无效的；
      （六）被依法追究刑事责任的。
    summary: |
      公司在以下六种情况下可以单方面辞退你且不支付补偿金：
      1. 试用期被证明不符合录用条件
      2. 严重违反公司规定
      3. 严重失职、营私舞弊造成重大损害
      4. 同时在其他公司工作且严重影响本职，或经提醒后仍不改正
      5. 以欺诈手段订立劳动合同
      6. 被追究刑事责任
      注意：如果公司随意说"不符合条件"但无法证明，属于违法解除。
    keywords: [解除劳动合同, 辞退, 用人单位, 试用期, 严重违反, 失职, 刑事责任]
    tags: [劳动者权利, 解雇, 无补偿]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第47条"
    ref_en: "Article 47"
    title: 经济补偿金的计算
    full_text: |
      经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资的标准向劳动者支付。
      六个月以上不满一年的，按一年计算；不满六个月的，向劳动者支付半个月工资的经济补偿。
      劳动者月工资高于用人单位所在直辖市、设区的市级人民政府公布的本地区上年度
      职工月平均工资三倍的，向其支付经济补偿的标准按职工月平均工资三倍的数额支付，
      向其支付经济补偿的年限最高不超过十二年。
      本条所称月工资是指劳动者在劳动合同解除或者终止前十二个月的平均工资。
    summary: |
      如果你被公司合法辞退（非过错性辞退），可以获得经济补偿金，简称"N"：
      • 工作满1年 → 赔1个月工资
      • 工作满6个月但不满1年 → 按1年算，赔1个月
      • 工作不满6个月 → 赔半个月工资
      • 如果你的工资特别高（超过当地平均工资3倍），补偿金封顶为36个月（3倍×12年）
      注意：如果是你自己辞职或被合法开除（第39条的情况），则没有补偿。
    keywords: [经济补偿金, N, 辞退, 解雇, 补偿, 工资]
    tags: [劳动者权利, 经济补偿]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第82条"
    ref_en: "Article 82"
    title: 未签书面合同的后果
    full_text: |
      用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，
      应当向劳动者每月支付二倍的工资。
      用人单位违反本法规定不与劳动者订立无固定期限劳动合同的，自应当订立
      无固定期限劳动合同之日起向劳动者每月支付二倍的工资。
    summary: |
      如果公司不跟你签书面合同：
      • 入职超过1个月但不满1年没签合同 → 公司要付你双倍工资
      • 应该签无固定期限合同但公司不签 → 也要付双倍工资
      这是保护劳动者的重要条款！记住：不签合同不仅是公司违规，你还能拿双倍工资。
    keywords: [劳动合同, 双倍工资, 未签合同, 劳动者权利]
    tags: [劳动者权利, 合同签订]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第10条"
    ref_en: "Article 10"
    title: 建立劳动关系应订立书面合同
    full_text: |
      建立劳动关系，应当订立书面劳动合同。
      已建立劳动关系，未同时订立书面劳动合同的，应当自用工之日起一个月内订立书面劳动合同。
      用人单位与劳动者在用工前订立劳动合同的，劳动关系自用工之日起建立。
    summary: |
      只要建立了劳动关系，就必须签书面劳动合同。
      公司必须在用工之日起1个月内和你签合同。
      即使先签了合同，劳动关系也是从你实际开始上班那天算起。
    keywords: [书面合同, 劳动关系, 用工, 签订]
    tags: [劳动者权利, 合同签订]
    life_stage_tags: [young_adult]
    difficulty: 1
