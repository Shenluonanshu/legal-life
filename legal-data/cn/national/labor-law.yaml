# ============================================================
# 中国劳动法律法规
# ============================================================
law_name: 中华人民共和国劳动合同法
law_name_en: Labor Contract Law of the People's Republic of China
category: employment
country_code: CN
effective_date: 2008-01-01
last_amended: 2012-12-28
source_url: https://flk.npc.gov.cn/detail2.html?ZmY4MDgxODE3OTZhNjM2YTAxNzk4MjJhMTk2NDBjOTI
source_name: 全国人民代表大会
articles:
  - ref: "第19条"
    ref_en: "Article 19"
    title: 试用期期限
    full_text: |
      劳动合同期限三个月以上不满一年的，试用期不得超过一个月；
      劳动合同期限一年以上不满三年的，试用期不得超过二个月；
      三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月。
      同一用人单位与同一劳动者只能约定一次试用期。
      以完成一定工作任务为期限的劳动合同或者劳动合同期限不满三个月的，不得约定试用期。
      试用期包含在劳动合同期限内。劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。
    summary: |
      简单来说，签合同时试用期的长度取决于合同期限：
      • 合同不满1年 → 试用期最多1个月
      • 合同1-3年 → 试用期最多2个月
      • 合同3年以上 → 试用期最多6个月
      • 同一家公司对同一个人只能约定一次试用期
      • 试用期是包含在合同期内的，不能单独签试用期合同
    keywords: [劳动合同, 试用期, 期限, 毕业生, 求职]
    tags: [劳动者权利, 入职]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第39条"
    ref_en: "Article 39"
    title: 用人单位单方解除劳动合同
    full_text: |
      劳动者有下列情形之一的，用人单位可以解除劳动合同：
      （一）在试用期间被证明不符合录用条件的；
      （二）严重违反用人单位的规章制度的；
      （三）严重失职，营私舞弊，给用人单位造成重大损害的；
      （四）劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出，拒不改正的；
      （五）因本法第二十六条第一款第一项规定的情形致使劳动合同无效的；
      （六）被依法追究刑事责任的。
    summary: |
      公司在以下六种情况下可以单方面辞退你且不支付补偿金：
      1. 试用期被证明不符合录用条件
      2. 严重违反公司规定
      3. 严重失职、营私舞弊造成重大损害
      4. 同时在其他公司工作且严重影响本职，或经提醒后仍不改正
      5. 以欺诈手段订立劳动合同
      6. 被追究刑事责任
      注意：如果公司随意说"不符合条件"但无法证明，属于违法解除。
    keywords: [解除劳动合同, 辞退, 用人单位, 试用期, 严重违反, 失职, 刑事责任]
    tags: [劳动者权利, 解雇, 无补偿]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "第47条"
    ref_en: "Article 47"
    title: 经济补偿金的计算
    full_text: |
      经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资的标准向劳动者支付。
      六个月以上不满一年的，按一年计算；不满六个月的，向劳动者支付半个月工资的经济补偿。
      劳动者月工资高于用人单位所在直辖市、设区的市级人民政府公布的本地区上年度
      职工月平均工资三倍的，向其支付经济补偿的标准按职工月平均工资三倍的数额支付，
      向其支付经济补偿的年限最高不超过十二年。
      本条所称月工资是指劳动者在劳动合同解除或者终止前十二个月的平均工资。
    summary: |
      如果你被公司合法辞退（非过错性辞退），可以获得经济补偿金，简称"N"：
      • 工作满1年 → 赔1个月工资
      • 工作满6个月但不满1年 → 按1年算，赔1个月
      • 工作不满6个月 → 赔半个月工资
      • 如果你的工资特别高（超过当地平均工资3倍），补偿金封顶为36个月（3倍×12年）
      注意：如果是你自己辞职或被合法开除（第39条的情况），则没有补偿。
    keywords: [经济补偿金, N, 辞退, 解雇, 补偿, 工资]
    tags: [劳动者权利, 经济补偿]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "第82条"
    ref_en: "Article 82"
    title: 未签书面合同的后果
    full_text: |
      用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，
      应当向劳动者每月支付二倍的工资。
      用人单位违反本法规定不与劳动者订立无固定期限劳动合同的，自应当订立
      无固定期限劳动合同之日起向劳动者每月支付二倍的工资。
    summary: |
      如果公司不跟你签书面合同：
      • 入职超过1个月但不满1年没签合同 → 公司要付你双倍工资
      • 应该签无固定期限合同但公司不签 → 也要付双倍工资
      这是保护劳动者的重要条款！记住：不签合同不仅是公司违规，你还能拿双倍工资。
    keywords: [劳动合同, 双倍工资, 未签合同, 劳动者权利]
    tags: [劳动者权利, 合同签订]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "第10条"
    ref_en: "Article 10"
    title: 建立劳动关系应订立书面合同
    full_text: |
      建立劳动关系，应当订立书面劳动合同。
      已建立劳动关系，未同时订立书面劳动合同的，应当自用工之日起一个月内订立书面劳动合同。
      用人单位与劳动者在用工前订立劳动合同的，劳动关系自用工之日起建立。
    summary: |
      只要建立了劳动关系，就必须签书面劳动合同。
      公司必须在用工之日起1个月内和你签合同。
      即使先签了合同，劳动关系也是从你实际开始上班那天算起。
    keywords: [书面合同, 劳动关系, 用工, 签订]
    tags: [劳动者权利, 合同签订]
    life_stage_tags: [young_adult]
    difficulty: 1

  - ref: "劳动法第41条"
    ref_en: "Labor Law Article 41"
    title: 加班时间限制
    full_text: |
      用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，
      一般每日不得超过一小时；因特殊原因需要延长工作时间的，在保障劳动者
      身体健康的条件下延长工作时间每日不得超过三小时，但是每月不得超过三十六小时。
    summary: |
      关于加班时间的硬性规定（注意：这是《劳动法》第41条，不是《劳动合同法》）：
      • 一般情况下：每天加班最多1小时
      • 特殊原因：每天最多3小时
      • 无论如何：每月加班不能超过36小时
      • 加班需要"经与工会和劳动者协商"，不能强迫
      如果公司强迫你超时加班，是违法的。现实中"996"屡见不鲜——知道这条规定，
      至少你能判断自己是否被侵权，以及如何留证（考勤、聊天记录、加班审批）。
    keywords: [加班, 工作时间, 36小时, 996, 劳动法, 超时加班]
    tags: [劳动者权利, 工时, 加班]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "劳动法第45条"
    ref_en: "Labor Law Article 45"
    title: 带薪年休假
    full_text: |
      国家实行带薪年休假制度。
      劳动者连续工作一年以上的，享受带薪年休假。具体办法由国务院规定。
    summary: |
      带薪年假是你的法定权利：
      • 连续工作满1年 → 有权享受带薪年休假
      • 具体天数（如5天/10天/15天）由国务院《职工带薪年休假条例》规定
      • 如果公司不让你休年假，应支付3倍工资补偿
      现实提醒：年假是"带薪"的，公司不能以"太忙"为由剥夺你的年假，也不能用调休冲抵。
    keywords: [年假, 带薪年休假, 休假, 劳动者权利, 3倍工资]
    tags: [劳动者权利, 休假, 福利]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 1

  - ref: "劳动法第50条"
    ref_en: "Labor Law Article 50"
    title: 工资支付
    full_text: |
      工资应当以货币形式按月支付给劳动者本人。不得克扣或者无故拖欠劳动者的工资。
    summary: |
      工资的"三铁律"：
      • 必须以货币形式支付（不能用实物、购物卡代替）
      • 必须按月支付
      • 不得克扣或无故拖欠
      如果公司拖欠工资，你可以向劳动监察部门投诉，或申请劳动仲裁要求支付工资和赔偿金。
      这是最基本也最容易维权的劳动者权利。
    keywords: [工资, 拖欠工资, 克扣, 按月支付, 劳动监察]
    tags: [劳动者权利, 工资, 报酬]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "劳动合同法第42条"
    ref_en: "Labor Contract Law Article 42"
    title: 不得解除劳动合同的情形
    full_text: |
      劳动者有下列情形之一的，用人单位不得依照本法第四十条、第四十一条的规定解除劳动合同：
      （一）从事接触职业病危害作业的劳动者未进行离岗前职业健康检查，
      或者疑似职业病病人在诊断或者医学观察期间的；
      （二）在本单位患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的；
      （三）患病或者非因工负伤，在规定的医疗期内的；
      （四）女职工在孕期、产期、哺乳期的；
      （五）在本单位连续工作满十五年，且距法定退休年龄不足五年的；
      （六）法律、行政法规规定的其他情形。
    summary: |
      这些情况下，公司不能随便辞退你（除非你自己有严重过错）：
      • 疑似职业病或正在诊断观察期
      • 患职业病或因工负伤丧失劳动能力
      • 患病或非因工负伤在医疗期内
      • ★ 女职工在孕期、产期、哺乳期（"三期"保护）
      • 连续工作满15年且距退休不足5年
      如果公司在这些情况下强行辞退，属于违法解除，要支付2倍经济补偿金。
    keywords: [解除劳动合同, 三期保护, 女职工, 医疗期, 职业病, 违法解除]
    tags: [劳动者权利, 解雇保护, 女职工保护]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 2

  - ref: "劳动合同法第24条"
    ref_en: "Labor Contract Law Article 24"
    title: 竞业限制
    full_text: |
      竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。
      竞业限制的范围、地域、期限由用人单位与劳动者约定，竞业限制的约定不得违反法律、法规的规定。
      在解除或者终止劳动合同后，前款规定的人员到与本单位生产或者经营同类产品、
      从事同类业务的有竞争关系的其他用人单位，或者自己开业生产或者经营同类产品、
      从事同类业务的，竞业限制期限，不得超过二年。
    summary: |
      "竞业限制"是什么？简单说：
      • 只有高管、高级技术人员、负有保密义务的人，才需要签竞业限制
      • 离职后不能去竞争公司、不能自己干同类业务
      • 竞业限制期限最多2年（超过2年无效）
      • ★ 公司要求你竞业限制，就必须按月给你经济补偿
      注意：普通员工如果被要求签竞业限制，要谨慎——这限制你跳槽，且公司需支付补偿。
    keywords: [竞业限制, 保密, 离职, 跳槽, 经济补偿, 高管]
    tags: [劳动者权利, 竞业限制, 保密]
    life_stage_tags: [young_adult, adult]
    difficulty: 3

  - ref: "劳动法第72条"
    ref_en: "Labor Law Article 72"
    title: 社会保险缴纳
    full_text: |
      社会保险基金按照保险类型确定资金来源，逐步实行社会统筹。
      用人单位和劳动者必须依法参加社会保险，缴纳社会保险费。
    summary: |
      社保是强制性的，不是"自愿"或"福利"：
      • 用人单位和劳动者都必须依法缴纳社保（养老、医疗、失业、工伤、生育）
      • 公司说"不交社保多给你发钱"是违法的，你将来会失去养老和医保
      • 试用期也必须交社保
      维权：如果公司不交社保，你可以向社保部门投诉，要求补缴。
    keywords: [社保, 社会保险, 五险, 缴纳, 养老金, 医保]
    tags: [劳动者权利, 社保, 福利]
    life_stage_tags: [young_adult, adult]
    difficulty: 1

  - ref: "劳动法第61条"
    ref_en: "Labor Law Article 61"
    title: 女职工孕期保护
    full_text: |
      不得安排女职工在怀孕期间从事国家规定的第三级体力劳动强度的劳动和孕期禁忌从事的劳动。
      对怀孕七个月以上的女职工，不得安排其延长工作时间和夜班劳动。
    summary: |
      怀孕女职工的特殊保护：
      • 不能安排从事高强度体力劳动和孕期禁忌劳动
      • 怀孕7个月以上 → 不能安排加班，不能上夜班
      • 产检时间算作正常工作时间，不能扣工资
      这些是法律对孕期的硬性保护，公司不能以"工作忙"为由拒绝。
    keywords: [女职工, 孕期, 产假, 劳动保护, 夜班, 三期]
    tags: [劳动者权利, 女职工保护]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "劳动合同法第38条"
    ref_en: "Labor Contract Law Article 38"
    title: 劳动者单方解除劳动合同
    full_text: |
      用人单位有下列情形之一的，劳动者可以解除劳动合同：
      （一）未按照劳动合同约定提供劳动保护或者劳动条件的；
      （二）未及时足额支付劳动报酬的；
      （三）未依法为劳动者缴纳社会保险费的；
      （四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；
      （五）因本法第二十六条第一款规定的情形致使劳动合同无效的；
      （六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。
      用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的，
      或者用人单位违章指挥、强令冒险作业危及劳动者人身安全的，
      劳动者可以立即解除劳动合同，不需事先告知用人单位。
    summary: |
      公司违法时，你可以主动辞职并要求经济补偿：
      • 不提供劳动保护、不按时足额发工资、不交社保 → 你可以解除合同并要求补偿
      • 规章制度违法损害你权益 → 可解除
      • 暴力威胁强迫劳动、强令冒险作业 → 可立即解除，不用提前告知
      这就是"被迫离职也能拿N"的法律依据！关键是要固定证据（拖欠工资记录、社保缺失证明等）。
    keywords: [解除劳动合同, 被迫离职, 拖欠工资, 社保, 经济补偿, 辞职]
    tags: [劳动者权利, 解除劳动合同, 被迫离职]
    life_stage_tags: [young_adult, adult]
    difficulty: 2

  - ref: "劳动合同法第40条"
    ref_en: "Labor Contract Law Article 40"
    title: 无过失性辞退
    full_text: |
      有下列情形之一的，用人单位提前三十日以书面形式通知劳动者本人
      或者额外支付劳动者一个月工资后，可以解除劳动合同：
      （一）劳动者患病或者非因工负伤，在规定的医疗期满后不能从事原工作，
      也不能从事由用人单位另行安排的工作的；
      （二）劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的；
      （三）劳动合同订立时所依据的客观情况发生重大变化，致使劳动合同无法履行，
      经用人单位与劳动者协商，未能就变更劳动合同内容达成协议的。
    summary: |
      "无过失性辞退"（不是你的错）需要 N 或 N+1：
      • 公司可以辞退，但要提前30天书面通知，或额外支付1个月工资（"代通知金"）
      • 还要按工作年限支付经济补偿金（N）
      • 适用情形：医疗期满不能工作、培训调岗后仍不胜任、客观情况重大变化
      区别：这是"合法辞退但给补偿"，和第39条"过错辞退不给补偿"完全不同。
    keywords: [无过失性辞退, 代通知金, 经济补偿, 不能胜任, N加1]
    tags: [劳动者权利, 解雇, 经济补偿]
    life_stage_tags: [young_adult, adult, middle_age]
    difficulty: 3
